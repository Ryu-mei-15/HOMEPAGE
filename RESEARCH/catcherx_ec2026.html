<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title">CatcherX: 捕手の認知-運動過程の循環に着目したVRシミュレータ - 山口 瑞悠</title>
  <link rel="icon" href="../fig/main.png">
  <link rel="apple-touch-icon" href="../fig/main.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 5px 10px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.8);
    }

    .lang-btn {
      padding: 5px;
      border: 0;
      color: #1e3a8a;
      background: none;
      font-weight: bold;
      cursor: pointer;
    }

    .lang-btn:hover,
    .lang-btn.active { color: #0ea5e9; }
    .lang-btn.active { text-decoration: underline; }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateX(-5px);
    }

    header,
    .section {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
    }

    header {
      margin-bottom: 40px;
      padding: 60px 20px;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #1e3a8a;
      font-size: 32px;
      line-height: 1.5;
    }

    .subtitle {
      margin: 0;
      color: #0ea5e9;
      font-size: 18px;
      font-weight: 600;
    }

    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .tech-tag {
      padding: 5px 15px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      color: #4b5563;
      background: #f3f4f6;
      font-size: 14px;
      font-weight: bold;
    }

    .section {
      padding: 60px 40px;
      border-radius: 15px;
      text-align: center;
    }

    .coming-soon {
      margin: 0 0 12px;
      color: #1e3a8a;
      font-size: clamp(38px, 8vw, 72px);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .coming-message {
      margin: 0;
      color: #64748b;
      font-size: 17px;
      line-height: 1.8;
    }

    footer {
      padding: 30px;
      color: white;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 23px; }
      .section { padding: 45px 20px; }
    }
  </style>
</head>
<body>
  <div class="floating-shapes" aria-hidden="true">
    <svg class="shape" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fff" /></svg>
    <svg class="shape" width="120" height="120" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="#fff" /></svg>
    <svg class="shape" width="90" height="90" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="#fff" /></svg>
  </div>

  <div class="container">
    <div class="lang-switcher">
      <button id="lang-ja" class="lang-btn active" type="button">JP</button>
      <span>/</span>
      <button id="lang-en" class="lang-btn" type="button">EN</button>
    </div>

    <a href="../index.html#publications-section" class="back-btn" data-i18n="back_btn">⬅ トップページへ戻る</a>

    <header>
      <h1 data-i18n="header_title">CatcherX</h1>
      <p class="subtitle" data-i18n="header_subtitle">捕手の認知-運動過程の循環に着目したVRシミュレータ</p>
      <div class="tech-tags">
        <span class="tech-tag">VR</span>
        <span class="tech-tag">HCI</span>
        <span class="tech-tag">Sports</span>
      </div>
    </header>

    <main>
      <section class="section">
        <p class="coming-soon">Coming Soon</p>
        <p class="coming-message" data-i18n="coming_message">詳細は今後公開予定です．</p>
      </section>
    </main>

    <footer><p data-i18n="footer_text">© 2026 山口 瑞悠 All Rights Reserved.</p></footer>
  </div>

  <script>
    const translations = {
      en: {
        page_title: "CatcherX: A VR Simulator Focusing on the Cycle of the Catcher's Perceptual–Motor Process - Miyu Yamaguchi",
        back_btn: "⬅ Back to Home",
        header_title: "CatcherX",
        header_subtitle: "A VR Simulator Focusing on the Cycle of the Catcher's Perceptual–Motor Process",
        coming_message: "Details will be published at a later date.",
        footer_text: "© 2026 Miyu Yamaguchi All Rights Reserved."
      },
      ja: {
        page_title: "CatcherX: 捕手の認知-運動過程の循環に着目したVRシミュレータ - 山口 瑞悠",
        back_btn: "⬅ トップページへ戻る",
        header_title: "CatcherX",
        header_subtitle: "捕手の認知-運動過程の循環に着目したVRシミュレータ",
        coming_message: "詳細は今後公開予定です．",
        footer_text: "© 2026 山口 瑞悠 All Rights Reserved."
      }
    };

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        const translation = translations[lang]?.[element.dataset.i18n];
        if (!translation) return;
        if (element.tagName === 'TITLE') {
          element.textContent = translation;
        } else if (/<[a-z][\s\S]*>/i.test(translation)) {
          element.innerHTML = translation;
        } else {
          element.textContent = translation;
        }
      });
      document.getElementById('lang-ja').classList.toggle('active', lang === 'ja');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      localStorage.setItem('preferredLanguage', lang);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('lang-ja').addEventListener('click', () => setLanguage('ja'));
      document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
      const preferredLanguage = localStorage.getItem('preferredLanguage');
      const browserLanguage = navigator.language.split('-')[0];
      setLanguage(preferredLanguage || (browserLanguage === 'en' ? 'en' : 'ja'));
    });
  </script>
</body>
</html>
