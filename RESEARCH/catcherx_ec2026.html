<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title data-i18n="page_title">CatcherX: 捕手の認知-運動過程の循環に着目したVRシミュレータ - 山口 瑞悠</title>
  <link rel="icon" href="../fig/main.png">
  <link rel="apple-touch-icon" href="../fig/main.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 5px 10px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.8);
    }

    .lang-btn {
      padding: 5px;
      border: 0;
      color: #1e3a8a;
      background: none;
      font-weight: bold;
      cursor: pointer;
    }

    .lang-btn:hover,
    .lang-btn.active { color: #0ea5e9; }
    .lang-btn.active { text-decoration: underline; }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateX(-5px);
    }

    header,
    .section {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
    }

    header {
      margin-bottom: 40px;
      padding: 60px 20px;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #1e3a8a;
      font-size: 32px;
      line-height: 1.5;
    }

    .subtitle {
      margin: 0;
      color: #0ea5e9;
      font-size: 18px;
      font-weight: 600;
    }

    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .tech-tag {
      padding: 5px 15px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      color: #4b5563;
      background: #f3f4f6;
      font-size: 14px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 30px;
      padding: 60px 40px;
      border-radius: 15px;
      text-align: center;
    }

    .section h2 {
      margin: 0 0 24px;
      padding-bottom: 10px;
      border-bottom: 3px solid #0ea5e9;
      color: #1e3a8a;
      font-size: 24px;
    }

    .award-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .award-card {
      padding: 24px;
      border: 1px solid #fde68a;
      border-radius: 14px;
      background: linear-gradient(145deg, #fffbeb, #fff);
    }

    .award-card h3 {
      margin: 0 0 12px;
      color: #1e3a8a;
      font-size: 20px;
      line-height: 1.5;
    }

    .award-card p {
      margin: 0;
      color: #475569;
      line-height: 1.8;
    }

    .award-link {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 14px;
      border: 1px solid #1e3a8a;
      border-radius: 16px;
      color: #1e3a8a;
      text-decoration: none;
      font-weight: bold;
    }

    .award-link:hover { background: #eff6ff; }

    .award-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .coming-soon {
      margin: 0 0 12px;
      color: #1e3a8a;
      font-size: clamp(38px, 8vw, 72px);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .coming-message {
      margin: 0;
      color: #64748b;
      font-size: 17px;
      line-height: 1.8;
    }

    footer {
      padding: 30px;
      color: white;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 23px; }
      .section { padding: 45px 20px; }
      .award-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../readability.css">
</head>
<body>
  <div class="floating-shapes" aria-hidden="true">
    <svg class="shape" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fff" /></svg>
    <svg class="shape" width="120" height="120" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="#fff" /></svg>
    <svg class="shape" width="90" height="90" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="#fff" /></svg>
  </div>

  <div class="container">
    <div class="lang-switcher">
      <button id="lang-ja" class="lang-btn active" type="button">JP</button>
      <span>/</span>
      <button id="lang-en" class="lang-btn" type="button">EN</button>
    </div>

    <a href="../index.html#publications-section" class="back-btn" data-i18n="back_btn">⬅ トップページへ戻る</a>

    <header>
      <h1 data-i18n="header_title">CatcherX</h1>
      <p class="subtitle" data-i18n="header_subtitle">捕手の認知-運動過程の循環に着目したVRシミュレータ</p>
      <div class="tech-tags">
        <span class="tech-tag">VR</span>
        <span class="tech-tag">HCI</span>
        <span class="tech-tag">Sports</span>
      </div>
    </header>

    <main>
      <section class="section">
        <h2 data-i18n="awards_title">EC2026での表彰</h2>
        <div class="award-grid">
          <article class="award-card">
            <h3 data-i18n="award_1_title">🏆 特選セッション発表認定</h3>
            <p data-i18n="award_1_description">口頭発表に関するプログラム委員推薦賞</p>
          </article>
          <article class="award-card">
            <h3 data-i18n="award_2_title">🏆 レコメンデモ認定</h3>
            <p data-i18n="award_2_description">デモ・ポスター発表に関する専門委員推薦賞</p>
          </article>
        </div>
        <div class="award-actions">
          <a href="https://ec2026.entcomp.org/" target="_blank" rel="noopener noreferrer" class="award-link" data-i18n="ec2026_link">EC2026 公式サイトを見る ↗</a>
          <a href="../NEWS/award_ec2026.html" class="award-link" data-i18n="award_link">表彰の詳細を見る ➡</a>
        </div>
      </section>

      <section class="section">
        <p class="coming-soon">Coming Soon</p>
        <p class="coming-message" data-i18n="coming_message">詳細は今後公開予定です．</p>
      </section>
    </main>

    <footer><p data-i18n="footer_text">© 2026 山口 瑞悠 All Rights Reserved.</p></footer>
  </div>

  <script>
    const translations = {
      en: {
        page_title: "CatcherX: A VR Simulator Focusing on the Cycle of the Catcher's Perceptual–Motor Process - Miyu Yamaguchi",
        back_btn: "⬅ Back to Home",
        header_title: "CatcherX",
        header_subtitle: "A VR Simulator Focusing on the Cycle of the Catcher's Perceptual–Motor Process",
        awards_title: "EC2026 Recognitions",
        award_1_title: "🏆 Selected Session Presentation Recognition",
        award_1_description: "Program Committee Recommendation for Oral Presentation",
        award_2_title: "🏆 Recommended Demo Recognition",
        award_2_description: "Expert Committee Recommendation for Demo/Poster Presentation",
        ec2026_link: "Visit the official EC2026 website ↗",
        award_link: "View Recognition Details ➡",
        coming_message: "Details will be published at a later date.",
        footer_text: "© 2026 Miyu Yamaguchi All Rights Reserved."
      },
      ja: {
        page_title: "CatcherX: 捕手の認知-運動過程の循環に着目したVRシミュレータ - 山口 瑞悠",
        back_btn: "⬅ トップページへ戻る",
        header_title: "CatcherX",
        header_subtitle: "捕手の認知-運動過程の循環に着目したVRシミュレータ",
        awards_title: "EC2026での表彰",
        award_1_title: "🏆 特選セッション発表認定",
        award_1_description: "口頭発表に関するプログラム委員推薦賞",
        award_2_title: "🏆 レコメンデモ認定",
        award_2_description: "デモ・ポスター発表に関する専門委員推薦賞",
        ec2026_link: "EC2026 公式サイトを見る ↗",
        award_link: "表彰の詳細を見る ➡",
        coming_message: "詳細は今後公開予定です．",
        footer_text: "© 2026 山口 瑞悠 All Rights Reserved."
      }
    };

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        const translation = translations[lang]?.[element.dataset.i18n];
        if (!translation) return;
        if (element.tagName === 'TITLE') {
          element.textContent = translation;
        } else if (/<[a-z][\s\S]*>/i.test(translation)) {
          element.innerHTML = translation;
        } else {
          element.textContent = translation;
        }
      });
      document.getElementById('lang-ja').classList.toggle('active', lang === 'ja');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      localStorage.setItem('preferredLanguage', lang);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('lang-ja').addEventListener('click', () => setLanguage('ja'));
      document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
      const preferredLanguage = localStorage.getItem('preferredLanguage');
      const browserLanguage = navigator.language.split('-')[0];
      setLanguage(preferredLanguage || (browserLanguage === 'en' ? 'en' : 'ja'));
    });
  </script>
</body>
</html>
