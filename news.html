<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title">お知らせ一覧 - 山口 瑞悠</title>
  
  <link rel="icon" href="fig/main.png">
  <link rel="apple-touch-icon" href="fig/main.png">

  <link rel="stylesheet" href="style.css">

  <style>
    /* news.html 固有のスタイル */
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 30px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateX(-5px);
    }

    header {
      text-align: center;
      padding: 60px 20px;
      margin-bottom: 40px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 36px;
      color: #1e3a8a;
      margin: 0;
    }

    .section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .news-list {
      list-style: none;
      padding: 0;
    }

    .news-list li {
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 0;
      display: flex;
      gap: 20px;
      align-items: baseline;
    }

    .news-list li:last-child {
      border-bottom: none;
    }

    .news-date {
      font-weight: bold;
      color: #6b7280;
      min-width: 100px;
    }

    .news-tag {
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .news-link {
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 500;
      font-size: 18px;
      transition: color 0.3s;
    }

    .news-link:hover {
      text-decoration: underline;
      color: #0ea5e9;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: white;
      font-size: 14px;
    }

    /* 言語切り替えボタン */
    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      padding: 5px 10px;
      border-radius: 15px;
      display: flex;
      gap: 5px;
      align-items: center;
      z-index: 10;
    }
    .lang-btn {
      background: none;
      border: none;
      color: #1e3a8a;
      font-weight: bold;
      cursor: pointer;
      padding: 5px;
      transition: color 0.3s;
    }
    .lang-btn:hover { color: #0ea5e9; }
    .lang-btn.active { color: #0ea5e9; text-decoration: underline; }

    @media (max-width: 768px) {
      .news-list li {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
 </head>
 <body>
  <div class="floating-shapes">
   <svg class="shape" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#ffffff" /></svg>
   <svg class="shape" width="120" height="120" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="#ffffff" /></svg>
   <svg class="shape" width="90" height="90" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="#ffffff" /></svg>
  </div>

  <div class="container">
    <div class="lang-switcher">
      <button id="lang-ja" class="lang-btn active">JP</button>
      <span>/</span>
      <button id="lang-en" class="lang-btn">EN</button>
    </div>

    <a href="index.html#news-section" class="back-btn" data-i18n="back_btn">⬅ トップページへ戻る</a>
    
    <header>
      <h1 data-i18n="header_title">お知らせ一覧</h1>
    </header>

    <main class="section">
      <ul class="news-list">
        <li>
          <span class="news-date">2026.05.15</span>
          <span class="news-tag" style="background:#3b82f6;">Media</span>
          <a href="news_admission2027.html" class="news-link" data-i18n="news_item_admission">2027年度 入学案内パンフレットにメイン記事が掲載されます</a>
        </li>
        <li>
          <span class="news-date">2026.05.12</span>
          <span class="news-tag" style="background:#fbbf24;">Award</span>
          <a href="award_president_2025.html" class="news-link" data-i18n="news_item_president">2025年度 学長褒章を受章しました</a>
        </li>
        <li>
          <span class="news-date">2025.09.24</span>
          <span class="news-tag" style="background:#10b981;">Web</span>
          <a href="news_univ_article.html" class="news-link" data-i18n="news_item_univ">福知山公立大学公式HPにてEC2025優秀賞の受賞記事が公開されました</a>
        </li>
        <li>
          <span class="news-date">2025.08.31</span>
          <span class="news-tag" style="background:#fbbf24;">Award</span>
          <a href="award_ec2025.html" class="news-link" data-i18n="news_item_ec">EC2025にて一般セッション優秀賞を受賞しました</a>
        </li>
      </ul>
    </main>

    <footer>
      <p data-i18n="footer_text">© 2025 山口 瑞悠 All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const translations = {
      en: {
        page_title: "News - Miyu Yamaguchi",
        back_btn: "⬅ Back to Home",
        header_title: "News Archive",
        news_item_admission: "Featured as the main article in the 2027 University Admission Guide.",
        news_item_president: "Received the 2025 President's Award from the university.",
        news_item_univ: "An article about EC2025 Excellence Award has been published on the University website.",
        news_item_ec: "Received the Excellent Presentation Award at EC2025.",
        footer_text: "© 2025 Miyu Yamaguchi All Rights Reserved."
      },
      ja: {
        page_title: "お知らせ一覧 - 山口 瑞悠",
        back_btn: "⬅ トップページへ戻る",
        header_title: "お知らせ一覧",
        news_item_admission: "2027年度 入学案内パンフレットにメイン記事が掲載されます",
        news_item_president: "2025年度 学長褒章を受章しました",
        news_item_univ: "福知山公立大学公式HPにてEC2025優秀賞の受賞記事が公開されました",
        news_item_ec: "EC2025にて一般セッション優秀賞を受賞しました",
        footer_text: "© 2025 山口 瑞悠 All Rights Reserved."
      }
    };

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const translation = translations[lang]?.[key];
        if (translation) {
          if (el.tagName === 'TITLE') {
            el.textContent = translation;
          } else {
            el.textContent = translation;
          }
        }
      });
      document.getElementById('lang-ja').classList.toggle('active', lang === 'ja');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      localStorage.setItem('preferredLanguage', lang);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('lang-ja').addEventListener('click', () => setLanguage('ja'));
      document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
      const preferredLanguage = localStorage.getItem('preferredLanguage');
      const browserLanguage = navigator.language.split('-')[0];
      const initialLang = preferredLanguage || (browserLanguage === 'en' ? 'en' : 'ja');
      setLanguage(initialLang);
    });
  </script>
 </body>
</html>
