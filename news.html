  <style>
    /* 共通基本設定（背景固定化） */
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%) fixed;
      min-height: 100vh;
      color: #333;
    }
    .floating-shapes {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .shape { position: absolute; opacity: 0.15; animation: float 20s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(30px, -30px) rotate(90deg); } 50% { transform: translate(-20px, 20px) rotate(180deg); } 75% { transform: translate(40px, 10px) rotate(270deg); } }
    .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .back-btn { display: inline-block; padding: 10px 20px; background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; border-radius: 20px; font-weight: bold; margin-bottom: 30px; backdrop-filter: blur(5px); }
    header { text-align: center; padding: 60px 20px; margin-bottom: 40px; background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
    h1 { font-size: 36px; color: #1e3a8a; margin: 0; }
    .section { background: rgba(255, 255, 255, 0.95); border-radius: 15px; padding: 40px; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
    .news-list { list-style: none; padding: 0; }
    .news-list li { border-bottom: 1px solid #e5e7eb; padding: 20px 0; display: flex; gap: 20px; align-items: baseline; }
    .news-list li:last-child { border-bottom: none; }
    .news-date { font-weight: bold; color: #6b7280; min-width: 100px; }
    .news-tag { color: white; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .news-link { color: #1e3a8a; text-decoration: none; font-weight: 500; font-size: 18px; }
    .news-link:hover { text-decoration: underline; color: #0ea5e9; }
    footer { text-align: center; padding: 30px; color: white; font-size: 14px; }
    @media (max-width: 768px) { .news-list li { flex-direction: column; gap: 10px; } }
  </style>
 </head>
